---
# Confluent Platform without ZooKeeper (KRaft), required for Confluent Platform 8.0 and newer.
# Select it with COMPOSE_FILE=docker-compose.kraft.yml. Older versions use docker-compose.yml.
services:
  broker:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://${KAFKA_BROKER_IPV4}:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      schema-registry-net:
        ipv4_address: ${KAFKA_BROKER_IPV4}

  schema_registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION}
    hostname: schema_registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: ${SCHEMA_REGISTRY_IPV4}
      SCHEMA_REGISTRY_LISTENERS: "http://${SCHEMA_REGISTRY_IPV4}:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://${KAFKA_BROKER_IPV4}:9092'
    networks:
      schema-registry-net:
        ipv4_address: ${SCHEMA_REGISTRY_IPV4}

networks:
  schema-registry-net:
    name: avro-serde-php-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${CONFLUENT_NETWORK_SUBNET}"
          gateway: "${CONFLUENT_NETWORK_GATEWAY}"
